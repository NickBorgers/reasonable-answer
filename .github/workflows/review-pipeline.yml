---
name: Review pipeline — orchestrator

# Called only by review-entry.yml, which owns authorization and the dedup claim.
#
# Graph:  gather → {invariant, docs, security, test, quality} → judge → finalize
#
# The reviewer jobs are static callers rather than a matrix, because
# `strategy.matrix` cannot be used on a job that `uses:` a reusable workflow, and
# `matrix.*` is not available in a reusable caller's `if:`. Getting that wrong produces
# a startup_failure with no logs and nothing to debug.

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      reviewed_sha:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      force_review:
        description: >
          Set when a human typed `/review`. Suppresses the merge-from-base inherit
          short-circuit, which otherwise re-stamps the prior verdict and skips the panel.
        required: false
        default: false
        type: boolean
    secrets:
      WORKFLOW_PAT:
        required: true

permissions:
  contents: read
  issues: read
  packages: read
  pull-requests: read
  statuses: write
  actions: read

env:
  # The fixer claims its own post-push SHA (review-fixer.yml's Push step), so the
  # `synchronize` event that push fires is normally suppressed and no second pipeline
  # reviews the fix — the owner's intent is that fixer output reaches main on the
  # pre-fix panel plus the fixer's own gates (schema, lint, marker gate, remote-head
  # check), without a further cycle. See docs/decisions.md D-fixer-merges-not-rebases.
  #
  # That means this is now mostly a race-window backstop, not a normal-path loop
  # breaker. A genuine cycle 2 only happens if the claim loses the race against GitHub
  # scheduling the synchronize event — the claim has to be written *after* the push
  # completes, since the statuses API 422s on a SHA it hasn't seen, which leaves a real
  # (if bounded) window. `fix_allowed` is false by cycle 2 (cycle < MAX_CYCLES is
  # required), so an accidental re-review cannot also re-fix; a third cycle is capped
  # and finalizes NO-GO. Worst case is one wasted extra cycle, not a loop.
  #
  # Every other way a fresh cycle starts is a human commit, which always resets the
  # counter (see `Compute cycle` below) — so day to day this cap bounds repeated NO-GO
  # iterations on a PR a human keeps pushing to, not automated fix/review ping-pong.
  MAX_CYCLES: '2'
  # Commits authored by the resolver agent. Used to tell machine pushes from human ones.
  AGENT_COMMIT_EMAIL: 'ci@reasonable-answer.local'

jobs:
  gather:
    name: Gather cycle state
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cycle: ${{ steps.cycle.outputs.cycle }}
      cap_exhausted: ${{ steps.cycle.outputs.cap_exhausted }}
      fix_allowed: ${{ steps.cycle.outputs.fix_allowed }}
      needs_sync: ${{ steps.drift.outputs.needs_sync }}
      inherit: ${{ steps.inherit.outputs.inherit }}
      inherited_verdict: ${{ steps.inherit.outputs.inherited_verdict }}
      roles: ${{ steps.classify.outputs.roles }}
    steps:
      - name: Checkout main (for composite actions)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-checkout

      - name: Checkout reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          fetch-depth: 0
          path: pr-head

      - name: Read prior cycle
        id: prior
        uses: ./main-checkout/.github/actions/review-state
        with:
          op: read-cycle
          sha: ${{ inputs.reviewed_sha }}
          base_sha: ${{ inputs.base_sha }}
          github_token: ${{ secrets.WORKFLOW_PAT }}

      # Whether the reviewed SHA is behind the base branch, i.e. a base-branch sync (D-fixer-merges-not-rebases)
      # is needed. This is the one thing that lets `fix` run when every reviewer guard
      # refused (D-unguarded-sync, issue #70).
      #
      # A reviewer's guard requires a completed `PR Validation Required` on the reviewed
      # SHA. Whenever that check is absent or red while the base has moved underneath the
      # branch, every guard refuses, `record-cycle` is skipped, and the fixer — the only
      # stage that can resync — never ran. The sharpest case is a PR that conflicts with
      # its base: no merge ref ⇒ no `pull_request` event ⇒ no PR Validation, forever.
      # `/review` reaches this graph via `issue_comment`, which fires regardless of merge
      # state, but with the panel guarded off the run did nothing. A sync consumes no
      # reviewer findings, so it does not need the reviewers to have run; `fix` keys its
      # sync-only path on this output. That path is non-agentic, so it repairs a
      # behind-the-base PR but not an already-conflicting one — see D-unguarded-sync.
      #
      # `merge-base --is-ancestor origin/<base> HEAD` is exactly the test the fixer's own
      # sync step uses, so the two agree on when a sync is due. Deliberately not a shallow
      # fetch: a branch further behind than the depth would get a wrong merge base.
      - name: Detect base-branch drift
        id: drift
        working-directory: pr-head
        env:
          BASE_REF: ${{ inputs.base_ref }}
          SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "${BASE_REF}"
          if git merge-base --is-ancestor "origin/${BASE_REF}" "${SHA}"; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "gather: ${SHA} already contains origin/${BASE_REF}; no base-branch sync needed"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
            echo "gather: ${SHA} is behind origin/${BASE_REF}; a base-branch sync is needed"
          fi

      # A merge of main into the PR branch is not new content to review. Without this,
      # routinely resyncing a long-lived branch burns cycles and can push a PR into the
      # cap without a single substantive change having been made.
      #
      # The predicate is about the *push*, not about the head commit (D-inherit-whole-range).
      # It used to ask "is HEAD a merge whose second parent is on the base branch", which
      # says nothing about what sits underneath that merge. Push content, then
      # `git merge origin/main`, and the whole push inherited the prior verdict with no
      # reviewer reading a line of it — a stale NO-GO re-stamped over real fixes in the
      # observed direction (#126, #127, #130), and a merge-gate bypass in the unobserved
      # one. So the question asked here is now "did this push add anything to review",
      # answered twice over: every commit added since the reviewed SHA must itself be a
      # base-resync merge, *and* recreating that merge from the reviewed SHA must reproduce
      # this commit's tree exactly. The second test is the one a conflict resolution — the
      # place arbitrary content can hide inside a correctly-shaped merge — cannot pass.
      - name: Detect merge-from-main
        id: inherit
        working-directory: pr-head
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.reviewed_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          PRIOR_CYCLE_SHA: ${{ steps.prior.outputs.cycle_sha }}
          FORCE_REVIEW: ${{ inputs.force_review }}
        run: |
          set -euo pipefail

          # Registers the same driver review-fixer.yml uses when it created this merge, so
          # recreating it here via `git merge-tree` reproduces the same tree it produced,
          # not a plain 3-way merge's tree. Mismatch here only costs a spent review cycle
          # (fail-closed to "review normally", below), never a correctness bug — but without
          # this the driver's whole benefit (successful inheritance on trivial resyncs) is
          # lost even when the merge itself was fine.
          #
          # Points at the trusted `main-checkout` ($GITHUB_WORKSPACE/main-checkout), not the
          # `pr-head` working directory this step runs in: this job carries WORKFLOW_PAT as
          # GH_TOKEN, and pr-head is a contributor-controlled checkout. Resolving the script
          # there would let a PR that edits scripts/merge_decisions.py run its own code in
          # this credentialed context before any reviewer has read a line of it.
          git config merge.decisions-append.driver \
            "python3 ${GITHUB_WORKSPACE}/main-checkout/scripts/merge_decisions.py %O %A %B"

          # Every refusal is the same plain "review this normally". Written once so a newly
          # added test cannot forget to emit the outputs the rest of the graph reads.
          review_normally() {
            echo "gather: $1; reviewing normally"
            {
              echo "inherit=false"
              echo "inherited_verdict="
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          # `/review` outranks this. Inheriting is an optimisation for automatic triggers —
          # a resync should not burn a cycle — but it also re-stamps the prior verdict
          # without reading anything, so a PR whose head is a merge-from-base had no way to
          # be re-reviewed at all: the one gesture documented as the human override was
          # answered by skipping the panel and re-publishing the old NO-GO. PR #56 sat in
          # exactly that state.
          if [ "$FORCE_REVIEW" = "true" ]; then
            review_normally "/review requested; not inheriting, reviewing this SHA on its merits"
          fi

          # Nothing to inherit, and no range to measure: the first cycle on a PR is read.
          if [ -z "$PRIOR_CYCLE_SHA" ]; then
            review_normally "no prior reviewed SHA"
          fi

          # A merge commit has two or more parents: "<sha> <parent1> <parent2>" is 3 words.
          parents=$(git rev-list --parents -n 1 "$SHA" | wc -w)
          if [ "$parents" -lt 3 ]; then
            review_normally "${SHA} is not a merge commit"
          fi

          git fetch --quiet origin "$BASE_REF"
          base="origin/${BASE_REF}"

          # Second parent already on the base branch ⇒ this merged base INTO the PR,
          # rather than bringing new work in from somewhere else.
          if ! git merge-base --is-ancestor "${SHA}^2" "$base"; then
            review_normally "${SHA}^2 is not on ${BASE_REF}"
          fi

          # "Everything since the reviewed SHA" only means something while that SHA is still
          # in this commit's history. A force-push replaces the chain and gets a fresh read.
          if ! git merge-base --is-ancestor "$PRIOR_CYCLE_SHA" "$SHA"; then
            review_normally "${PRIOR_CYCLE_SHA} is not an ancestor of ${SHA}"
          fi

          # Test 1 — whole-range shape. Every commit reachable from the head but from
          # neither the reviewed SHA nor the base branch is something this push put on the
          # PR's own side. Each must be a merge whose every merged-in parent is already on
          # the base branch; anything else is content nobody read. `^$base` is what keeps a
          # genuine resync from tripping this — the commits a resync brings across are
          # reachable from the base branch, so they are never counted against the push.
          added=0
          while IFS= read -r commit; do
            [ -n "$commit" ] || continue
            mapfile -t cparents < <(git rev-parse "${commit}^@")
            if [ "${#cparents[@]}" -lt 2 ]; then
              echo "gather:   ${commit} is a content commit under the head merge"
              added=$((added + 1))
              continue
            fi
            for parent in "${cparents[@]:1}"; do
              if ! git merge-base --is-ancestor "$parent" "$base"; then
                echo "gather:   ${commit} merges ${parent}, which is not on ${BASE_REF}"
                added=$((added + 1))
              fi
            done
          done < <(git rev-list "${PRIOR_CYCLE_SHA}..${SHA}" "^${base}")

          if [ "$added" -gt 0 ]; then
            review_normally "${added} unreviewed change(s) since ${PRIOR_CYCLE_SHA}"
          fi

          # Test 2 — tree identity. Shape alone still trusts a merge to contain only the
          # merge, and a conflict resolution can put arbitrary content into a commit that
          # passes test 1 on every parent. So recreate the merge and compare trees: any
          # difference — a hand resolution, a `-s ours` that dropped base content, an
          # octopus third parent — is content no verdict was ever issued about.
          #
          # `--write-tree` needs git >= 2.38, and a recreate that conflicts exits non-zero.
          # Both land on the same branch, which reviews rather than inherits. Fail-closed is
          # the right direction: the cost is one spent cycle, never an unread merge.
          if ! merged_tree=$(git merge-tree --write-tree "$PRIOR_CYCLE_SHA" "${SHA}^2" 2>/dev/null); then
            review_normally "could not cleanly recreate the merge of ${PRIOR_CYCLE_SHA} and ${SHA}^2"
          fi
          head_tree=$(git rev-parse "${SHA}^{tree}")
          if [ "$merged_tree" != "$head_tree" ]; then
            review_normally "recreating the merge yields tree ${merged_tree}, not ${head_tree}"
          fi

          inherited=$(gh api "repos/${REPO}/commits/${PRIOR_CYCLE_SHA}/statuses" \
            --jq '[.[] | select(.context == "review/verdict")] | sort_by(.created_at) | last | .description // empty')
          if [ -z "$inherited" ]; then
            review_normally "pure merge-from-${BASE_REF} but no prior verdict to inherit"
          fi

          echo "gather: pure merge-from-${BASE_REF} since ${PRIOR_CYCLE_SHA}; inheriting prior verdict '${inherited}'"
          {
            echo "inherit=true"
            echo "inherited_verdict=$inherited"
          } >> "$GITHUB_OUTPUT"

      - name: Compute cycle
        id: cycle
        working-directory: pr-head
        env:
          SHA: ${{ inputs.reviewed_sha }}
          PRIOR: ${{ steps.prior.outputs.cycle }}
        run: |
          set -euo pipefail

          prior="${PRIOR:-0}"
          cycle=$((prior + 1))

          # MAX_CYCLES bounds the AGENT loop — review → fix → push → review — so only
          # agent-authored commits are billed against it. A human push is a new
          # conversation: they read the blockers and answered them, and the next run is
          # cycle 1 of that conversation, with its own fixer attempt.
          #
          # This used to reset only on top of a GO, which made the counter bill humans for
          # the very iteration the blockers asked them to do. PR #49 hit the wall: three
          # human pushes (one of them repairing the CI failure that caused the burn in the
          # first place) walked it to cycle 3, and it finalized `cycle_capped` with no
          # reviewer ever reading the fixes. The only recovery was a force-push — a
          # destructive gesture as the routine answer to a counter working as designed.
          #
          # The loop the cap exists to break cannot escape this: the fixer authors as
          # AGENT_COMMIT_EMAIL, so a fix-push never resets, and a human has to intervene
          # for the budget to refresh. That intervention is the bound.
          author_email=$(git log -1 --format='%ae' "$SHA")
          if [ "$prior" -gt 0 ] && [ "$author_email" != "$AGENT_COMMIT_EMAIL" ]; then
            echo "gather: human commit (${author_email}); resetting cycle to 1 (was ${prior})"
            cycle=1
          fi

          cap_exhausted=false
          if [ "$cycle" -gt "${MAX_CYCLES}" ]; then
            cap_exhausted=true
            echo "gather: cycle ${cycle} exceeds cap ${MAX_CYCLES}"
          fi

          # Whether the fixer may run. Computed here rather than in the fixer job's `if:`
          # because the `env` context is not available to job-level conditions — only
          # github, needs, vars, and inputs are.
          #
          # A fix pushed on the last permitted cycle would never be reviewed, since the
          # cycle it creates is capped. That lands unexamined agent-written code on the
          # branch and reports it as progress, which is worse than returning the blockers
          # to a human intact.
          fix_allowed=false
          if [ "$cap_exhausted" = "false" ] && [ "$cycle" -lt "${MAX_CYCLES}" ]; then
            fix_allowed=true
          fi

          echo "gather: cycle=${cycle} (prior=${prior}) cap_exhausted=${cap_exhausted} fix_allowed=${fix_allowed}"
          {
            echo "cycle=$cycle"
            echo "cap_exhausted=$cap_exhausted"
            echo "fix_allowed=$fix_allowed"
          } >> "$GITHUB_OUTPUT"

      - name: Select applicable reviewer roles
        id: classify
        if: steps.cycle.outputs.cap_exhausted != 'true' && steps.inherit.outputs.inherit != 'true'
        uses: ./main-checkout/.github/actions/review-classify
        with:
          base_sha: ${{ inputs.base_sha }}
          head_sha: ${{ inputs.reviewed_sha }}
          repo_dir: pr-head

  # ── Reviewers ────────────────────────────────────────────────────────────────
  # Roles run on different model families on purpose. This project's own design argues
  # that decorrelated blind spots are what make independent review worth more than
  # repeated review; the same reasoning applies to its CI.
  #
  # Each role also names its model, not just its family. Left unpinned, a role runs whatever
  # the CLI vendor currently defaults to, so the panel's composition could change without a
  # diff — and a verdict has to be attributable to something reviewable. The pins are sized
  # to each role's job; the family split they sit inside is the part QP3 protects
  # (D-ci-model-pinning).

  review-invariant:
    name: 'Review: invariant'
    needs: gather
    if: |
      needs.gather.outputs.cap_exhausted != 'true' &&
      needs.gather.outputs.inherit != 'true' &&
      contains(fromJSON(needs.gather.outputs.roles), 'invariant')
    uses: ./.github/workflows/review-reviewer.yml
    with:
      role: invariant
      agent: claude
      # The never-abstain backstop on the six invariants and the merge gate. Nothing
      # downstream catches a safety-property regression this role misses, so it is the role
      # where the tier is chosen for headroom rather than for economy.
      model: claude-opus-5
      pr_number: ${{ inputs.pr_number }}
      reviewed_sha: ${{ inputs.reviewed_sha }}
      base_ref: ${{ inputs.base_ref }}
      cycle: ${{ needs.gather.outputs.cycle }}
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}

  review-docs:
    name: 'Review: docs'
    needs: gather
    if: |
      needs.gather.outputs.cap_exhausted != 'true' &&
      needs.gather.outputs.inherit != 'true' &&
      contains(fromJSON(needs.gather.outputs.roles), 'docs')
    uses: ./.github/workflows/review-reviewer.yml
    with:
      role: docs
      agent: codex
      # The most mechanical role in the panel: does the prose match the diff, and did a
      # behaviour change bring its decision entry with it. Both are checks against text that
      # is present, so it is the one role given the lower tier.
      model: gpt-5.6-luna
      pr_number: ${{ inputs.pr_number }}
      reviewed_sha: ${{ inputs.reviewed_sha }}
      base_ref: ${{ inputs.base_ref }}
      cycle: ${{ needs.gather.outputs.cycle }}
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}

  review-security:
    name: 'Review: security'
    needs: gather
    if: |
      needs.gather.outputs.cap_exhausted != 'true' &&
      needs.gather.outputs.inherit != 'true' &&
      contains(fromJSON(needs.gather.outputs.roles), 'security')
    uses: ./.github/workflows/review-reviewer.yml
    with:
      role: security
      agent: codex
      # Guards the SSRF/egress boundary and the untrusted-text-never-instructs invariant,
      # where a missed finding reaches production rather than merely the next cycle.
      model: gpt-5.6-sol
      pr_number: ${{ inputs.pr_number }}
      reviewed_sha: ${{ inputs.reviewed_sha }}
      base_ref: ${{ inputs.base_ref }}
      cycle: ${{ needs.gather.outputs.cycle }}
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}

  review-test:
    name: 'Review: test'
    needs: gather
    if: |
      needs.gather.outputs.cap_exhausted != 'true' &&
      needs.gather.outputs.inherit != 'true' &&
      contains(fromJSON(needs.gather.outputs.roles), 'test')
    uses: ./.github/workflows/review-reviewer.yml
    with:
      role: test
      agent: claude
      # A bounded, checklist-shaped job against the table in test.md — offline markers,
      # weakened assertions, coverage of the diff. Sized to the work, not to the family.
      model: claude-sonnet-5
      pr_number: ${{ inputs.pr_number }}
      reviewed_sha: ${{ inputs.reviewed_sha }}
      base_ref: ${{ inputs.base_ref }}
      cycle: ${{ needs.gather.outputs.cycle }}
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}

  review-quality:
    name: 'Review: quality'
    needs: gather
    if: |
      needs.gather.outputs.cap_exhausted != 'true' &&
      needs.gather.outputs.inherit != 'true' &&
      contains(fromJSON(needs.gather.outputs.roles), 'quality')
    uses: ./.github/workflows/review-reviewer.yml
    with:
      role: quality
      # Codex on purpose: this role deconflicts most heavily with `invariant`
      # (Claude), and the guard on the spec's direction should not share a model
      # family with the guard on the spec's conformance (QP3, D-quality-reviewer).
      agent: codex
      # Sol rather than the lower-tier Luna: this role may not rely on parametric memory of the
      # literature, so it has to actually fetch and read the sources the register cites
      # (D-quality-reviewer) — the most demanding reading task on the panel.
      model: gpt-5.6-sol
      pr_number: ${{ inputs.pr_number }}
      reviewed_sha: ${{ inputs.reviewed_sha }}
      base_ref: ${{ inputs.base_ref }}
      cycle: ${{ needs.gather.outputs.cycle }}
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}

  # ── Cycle accounting ─────────────────────────────────────────────────────────
  # The cycle counter records reviews performed, not pipeline runs started — so this is
  # written here, after the panel has actually read the code, rather than in `gather`.
  #
  # PR #49 is why. Its first run had every reviewer's guard refuse (PR Validation was red
  # on that SHA), so nothing was reviewed; `gather` had already recorded cycle 1 anyway,
  # the judge fail-closed an empty artifact set into a NO-GO, and the next push — the one
  # that fixed the validation failure — became cycle 2, where `fix_allowed` is false. The
  # PR's single automated fix attempt was spent on a run that read nothing, and four real
  # blockers came back with no fixer left to address them.
  #
  # Deferring the write means a run that reviewed nothing costs nothing: the next push
  # starts from the same cycle number. That is fail-open on the counter, and safe, because
  # `fix` needs this job — the only stage that can push, and therefore the only stage that
  # could ever advance the cap this counter bounds (see MAX_CYCLES above), cannot run on a
  # cycle that was never recorded.
  record-cycle:
    name: Record cycle
    needs: [gather, review-invariant, review-docs, review-security, review-test, review-quality]
    # A guard that errored outright reports an empty `reviewed`, which reads as false.
    if: |
      always() &&
      needs.gather.result == 'success' &&
      needs.gather.outputs.cap_exhausted != 'true' &&
      needs.gather.outputs.inherit != 'true' &&
      (needs.review-invariant.outputs.reviewed == 'true' ||
       needs.review-docs.outputs.reviewed == 'true' ||
       needs.review-security.outputs.reviewed == 'true' ||
       needs.review-test.outputs.reviewed == 'true' ||
       needs.review-quality.outputs.reviewed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Record cycle on the reviewed SHA
        uses: ./.github/actions/review-state
        with:
          op: write-status
          sha: ${{ inputs.reviewed_sha }}
          context: review/cycle
          state: success
          description: ${{ needs.gather.outputs.cycle }}
          github_token: ${{ secrets.WORKFLOW_PAT }}

  # ── Fixer ────────────────────────────────────────────────────────────────────
  # The only stage that may write to the branch. It runs between the reviewers and the
  # judge on purpose: the judge grades the SHA the reviewers actually read, not whatever
  # the fixer produced from it. Judging the post-fix tree would let the fixer clear its
  # own work unread.
  #
  # The fixed SHA is not reviewed again in the normal case — the fixer claims its own
  # post-push SHA (review-fixer.yml's Push step) specifically so the next pipeline never
  # starts. The owner's intent is that this ONE panel run, plus the fixer's own gates
  # (schema, lint, marker gate, remote-head check), is the whole review. See
  # docs/decisions.md D-fixer-merges-not-rebases.
  #
  # Skipped on the final permitted cycle. A fix pushed there would land on a SHA that a
  # claim race (see MAX_CYCLES above) could still route to a fresh review this run's own
  # cap forbids continuing — worse than returning the blockers to a human intact.
  #
  # `record-cycle` must succeed first, not merely finish. Normally the fixer's claim, not
  # this ordering, is what prevents a next pipeline run — but if that claim loses its race
  # against GitHub scheduling the synchronize event, the accidental run's `gather` reads
  # this SHA's cycle back by walking the commit chain. Pushing before the counter is
  # durable would let that race-window run see no recorded cycle, believe itself to be
  # cycle 1, and fix the same commit again.
  #
  # Two ways in, and they are disjoint (`record-cycle` succeeded XOR skipped):
  #
  #   (a) reviewers ran (`record-cycle` succeeded) and a fix is allowed — the normal
  #       path, unchanged. The fixer addresses blockers and, if the base moved, syncs in
  #       the same commit.
  #   (b) reviewers did NOT run (`record-cycle` was skipped: every guard refused) but the
  #       branch is behind the base — the sync-only path (D-unguarded-sync, issue #70). A base-branch
  #       sync consumes no reviewer findings, so it does not need `record-cycle` to have
  #       written a cycle. It is passed `sync_only: true`, which makes the fixer
  #       **non-agentic**: it commits a clean host-side merge and nothing else, and a
  #       merge that conflicts is abandoned rather than handed to the fixer agent. That
  #       restriction is the whole safety argument — see review-fixer.yml's `sync_only`
  #       input, and D-unguarded-sync for why an unvalidated, unreviewed tree must never reach a
  #       credentialed agent on the self-hosted runner.
  #
  #       Path (b) deliberately does NOT require `fix_allowed`. `fix_allowed` bars a
  #       blocker-fix on the last cycle because that fix would go unreviewed — but a sync
  #       addresses no blockers, and its pushed SHA becomes reviewable once mergeable, so
  #       the reason does not apply. It also writes no `review/cycle` (that is
  #       `record-cycle`'s job, and it was skipped), so a sync-only cycle costs nothing on
  #       the counter, exactly as a run that reviewed nothing should. `cap_exhausted` is
  #       still honoured on both paths: a genuinely exhausted PR takes the terminal
  #       cap-exhausted finalize and waits for a human, rather than being kept alive by an
  #       endless resync.
  fix:
    name: Fix
    needs: [gather, review-invariant, review-docs, review-security, review-test, review-quality, record-cycle]
    if: |
      always() &&
      needs.gather.result == 'success' &&
      needs.gather.outputs.cap_exhausted != 'true' &&
      needs.gather.outputs.inherit != 'true' &&
      (
        (needs.record-cycle.result == 'success' &&
         needs.gather.outputs.fix_allowed == 'true') ||
        (needs.record-cycle.result == 'skipped' &&
         needs.gather.outputs.needs_sync == 'true')
      )
    uses: ./.github/workflows/review-fixer.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      reviewed_sha: ${{ inputs.reviewed_sha }}
      head_ref: ${{ inputs.head_ref }}
      base_ref: ${{ inputs.base_ref }}
      cycle: ${{ needs.gather.outputs.cycle }}
      # True exactly on path (b): reviewers did not run, so nothing on this SHA has been
      # validated or read. It bars the fixer agent outright — the sync-only pass is a
      # host-side merge or nothing.
      sync_only: ${{ needs.record-cycle.result == 'skipped' }}
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}

  judge:
    name: Judge
    needs: [gather, review-invariant, review-docs, review-security, review-test, review-quality, fix]
    if: |
      always() &&
      needs.gather.result == 'success' &&
      needs.gather.outputs.cap_exhausted != 'true' &&
      needs.gather.outputs.inherit != 'true'
    uses: ./.github/workflows/review-judge.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      reviewed_sha: ${{ inputs.reviewed_sha }}
      cycle: ${{ needs.gather.outputs.cycle }}
      roles: ${{ needs.gather.outputs.roles }}
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}

  # ── Terminal paths ───────────────────────────────────────────────────────────

  finalize:
    name: Finalize
    needs: [gather, record-cycle, fix, judge]
    if: always() && needs.judge.result == 'success'
    uses: ./.github/workflows/review-finalize.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      reviewed_sha: ${{ inputs.reviewed_sha }}
      # `fix` is skipped outright (not merely a no-op) whenever fix_allowed was false —
      # e.g. the last permitted cycle — so its outputs.new_sha can be empty even on this
      # success path. Fall back to reviewed_sha in that case, same as a no-op push.
      #
      # A sync-only push (D-unguarded-sync) is deliberately NOT a post-fix SHA either, which is why
      # `record-cycle` is tested here. Everywhere else, finalize stamps review/cycle and
      # review/verdict on the pushed SHA because the fixer's claim guarantees no other run
      # ever will. The sync-only path suppresses that claim precisely so the successor gets
      # its own panel, so stamping it here would contradict "a sync-only pass consumes no
      # cycle" and — at cycle 2 — leave the successor already capped before that panel could
      # run. The statuses stay on the pre-sync SHA, which the mergeable successor supersedes.
      post_fix_sha: >-
        ${{ needs.record-cycle.result != 'skipped' && needs.fix.result == 'success' &&
        needs.fix.outputs.new_sha != '' && needs.fix.outputs.new_sha || inputs.reviewed_sha }}
      cycle: ${{ needs.gather.outputs.cycle }}
      verdict: ${{ needs.judge.outputs.verdict }}
      category: ${{ needs.judge.outputs.category }}
      skip_verdict_artifact: false
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}

  cap-exhausted:
    name: Finalize (cycle cap)
    needs: gather
    if: always() && needs.gather.result == 'success' && needs.gather.outputs.cap_exhausted == 'true'
    uses: ./.github/workflows/review-finalize.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      reviewed_sha: ${{ inputs.reviewed_sha }}
      # No fixer ran on this path (capped before `fix`'s `if` could even evaluate), so
      # the reviewed and post-fix SHAs are the same commit.
      post_fix_sha: ${{ inputs.reviewed_sha }}
      cycle: ${{ needs.gather.outputs.cycle }}
      verdict: 'NO-GO'
      category: cycle_capped
      # There is no verdict artifact on this path. An unconditional download would fail
      # the job before it applies labels or writes the merge-gate status, leaving the PR
      # with no verdict at all — worse than the NO-GO it was trying to report.
      skip_verdict_artifact: true
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}

  inherit:
    name: Finalize (inherited)
    needs: gather
    if: always() && needs.gather.result == 'success' && needs.gather.outputs.inherit == 'true'
    uses: ./.github/workflows/review-finalize.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      reviewed_sha: ${{ inputs.reviewed_sha }}
      # No fixer ran on this path either — inherit short-circuits before `fix` — so
      # again the reviewed and post-fix SHAs are the same commit.
      post_fix_sha: ${{ inputs.reviewed_sha }}
      cycle: ${{ needs.gather.outputs.cycle }}
      verdict: ${{ needs.gather.outputs.inherited_verdict }}
      category: inherited
      skip_verdict_artifact: true
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}

  cleanup-claim:
    name: Release dedup claim
    needs: [gather, fix, judge, finalize, cap-exhausted, inherit]
    # Unconditional. A crashed reviewer would otherwise leave `review/pipeline` pending
    # on this SHA forever, and every future run on it — including a human's /review —
    # would be refused by dedup with no way to clear it short of the API.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Advance the claim to a terminal state
        uses: ./.github/actions/review-state
        with:
          op: write-status
          sha: ${{ inputs.reviewed_sha }}
          context: review/pipeline
          state: success
          description: 'pipeline run complete'
          github_token: ${{ secrets.WORKFLOW_PAT }}

      - name: Advance the claim on the post-fix SHA
        # The fixer's Push step claims review/pipeline on its own new SHA (post-push,
        # pre-synchronize-event) specifically so that event finds the SHA taken and does
        # not open a second pipeline to re-review the fix. That claim never gets
        # advanced by anything else — no run is ever dispatched for that SHA — so if this
        # step didn't exist it would sit `pending` forever and refuse every future event
        # for it, including a human's `/review`.
        #
        # Skipped when fix was a no-op or didn't run (post-fix SHA equals reviewed SHA):
        # that SHA's claim is already being advanced by the step above.
        if: |
          needs.fix.result == 'success' &&
          needs.fix.outputs.new_sha != '' &&
          needs.fix.outputs.new_sha != inputs.reviewed_sha
        uses: ./.github/actions/review-state
        with:
          op: write-status
          sha: ${{ needs.fix.outputs.new_sha }}
          context: review/pipeline
          state: success
          description: 'pipeline run complete (post-fix)'
          github_token: ${{ secrets.WORKFLOW_PAT }}
