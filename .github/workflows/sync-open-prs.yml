---
name: Sync open PRs with the base branch

# The missing call site for the docs/decisions.md merge driver (D-base-moved-resync).
#
# D-decisions-merge-driver registered the driver everywhere the *review pipeline* merges,
# and every one of those places is reachable only from a review cycle. A PR that has
# already been cleared has no cycle left to run, so when the base moves under it nothing
# executes the driver. The repository can name a custom driver in `.gitattributes`, but
# the command is checkout-local git config; the event that needs that registered checkout
# is therefore this one: the base branch moved.
#
# Deliberately narrow. A PR is only touched when the unconfigured three-way merge conflicts
# AND the trusted driver resolves it. A PR that is merely behind is left alone: the driver
# is not what unblocks it, and re-merging it here would churn a
# SHA that the reviewers, the SHA-keyed dedup and the cycle counter are all keyed on.
#
# Security model. Two checkouts: `trusted`, the default branch, which is the only thing ever
# executed; and `work`, which is reset to a contributor's branch and never run from. That
# is the same split, for the same reason, as review-fixer.yml's sync step and
# review-pipeline.yml's inherit step — this job holds WORKFLOW_PAT and can push to any
# branch in the repository, so a PR's own copy of `scripts/` must not run in it. Fork PRs
# are excluded: their branches are not ours to push to.

on:
  push:
    branches: [main]

permissions:
  # Reads only. The push below authenticates with WORKFLOW_PAT, which is also what makes
  # the resulting `synchronize` event start a review run automatically. GitHub documents
  # a PR update made with GITHUB_TOKEN as approval-required; without automatic publication
  # the merge-gate status would wait for a human to approve the run on the new SHA.
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # One run at a time per base branch. Two runs would race each other's pushes, and the
  # loser's merge would be built on a head that no longer exists. Not cancel-in-progress:
  # cancelling mid-push is the one moment worth not interrupting.
  group: sync-open-prs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Re-merge the base into PRs the driver can unblock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Same reasoning as review-entry.yml's equivalent check: until WORKFLOW_PAT exists
      # this can do nothing, and every step that touches the API fails with an unhelpful
      # error. Say so once and stand down — a repository mid-setup should not show a wall
      # of red on every push to its default branch.
      - name: Check the token is configured
        id: configured
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${WORKFLOW_PAT}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WORKFLOW_PAT is not set; open PRs are not resynced with ${GITHUB_REF_NAME}"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # The trusted checkout. The merge driver, its registration helper and the sync script
      # are all executed from here and from nowhere else.
      - name: Check out the base branch
        if: steps.configured.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          path: trusted
          ref: ${{ github.event.repository.default_branch }}

      # The work tree. Reset to each PR's head in turn, never executed from. Full depth
      # deliberately: a branch further behind than a shallow fetch would get a merge base
      # that is not the real one.
      - name: Check out a work tree for the PR branches
        if: steps.configured.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          path: work
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Re-merge the base into every PR the driver can unblock
        id: resync
        if: steps.configured.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          # review-pipeline.yml resets the cycle counter on a commit not authored this way,
          # reading it as a human answering the blockers. A resync is not that.
          AGENT_COMMIT_EMAIL: 'ci@reasonable-answer.local'
          AGENT_COMMIT_NAME: 'reasonable-answer agent'
        run: |
          set -euo pipefail

          TRUSTED="${GITHUB_WORKSPACE}/trusted"
          WORK="${GITHUB_WORKSPACE}/work"

          # Open, same-repo, non-draft PRs targeting the branch that just moved. Forks are
          # excluded because their branches are not ours to push to; drafts because a draft
          # is not waiting on the merge button. `env.REPO` rather than string interpolation
          # keeps a repository name out of the jq program text.
          # Captured rather than piped straight into `mapfile`: a failure inside a process
          # substitution is invisible to `set -e`, and an empty list is exactly what a
          # rejected token produces. "Nothing to do" and "could not ask" must not look the
          # same in the log.
          if ! LISTED="$(gh api --paginate -X GET "repos/${REPO}/pulls" \
                          -f state=open -f base="${BASE_REF}" -f per_page=100 \
                          --jq '.[]
                                | select(.draft == false)
                                | select(.head.repo.full_name == env.REPO)
                                | "\(.number) \(.head.ref) \(.head.sha)"')"; then
            echo "::warning::could not list the open PRs targeting ${BASE_REF}; nothing was resynced"
            exit 0
          fi
          mapfile -t CANDIDATES < <(printf '%s\n' "${LISTED}")

          # How many review runs are still open on a branch. A run in flight will do this
          # sync itself if it needs one — gather detects the drift and the fixer performs
          # the merge with the same driver — and pushing underneath it is not merely
          # redundant: the fixer re-reads the remote head before pushing and discards a
          # whole cycle's fixes if the branch moved. So wait it out rather than race it.
          #
          # An unanswerable question counts as "in flight". The cost of being wrong that way
          # is a PR resynced on the next push to ${BASE_REF} instead of this one; the cost
          # of the other way is a discarded review cycle.
          inflight() {
            local answer
            if ! answer="$(gh api -X GET "repos/${REPO}/actions/workflows/review-entry.yml/runs" \
                            -f branch="$1" -f per_page=20 \
                            --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>&1)"; then
              echo "::warning::could not tell whether a review run is in flight on $1: ${answer}" >&2
              echo 1
              return
            fi
            echo "${answer}"
          }

          # Whether a cycle has been recorded on the head but its verdict is not published
          # yet, which is the second way this workflow can race a review (D-resync-defers-to-finalize).
          # `record-cycle` writes `review/cycle` as soon as the panel has read the code;
          # `review/verdict-anchor` lands minutes later, when finalize runs. A merge pushed
          # inside that window hands the successor's `gather` a cycle-recorded SHA carrying no
          # anchor, and an anchor that cannot be verified is not an anchor — the classifier
          # fail-closes to a full five-role panel on a head whose only delta is this merge
          # (D-inherit-reviewed-anchor). So the anchor is worth the same wait as a run in
          # flight, for the same reason: the cost of waiting is one push to ${BASE_REF}, and
          # the cost of not waiting is a panel.
          #
          # Bounded by the age of the cycle record rather than by the wait alone. A run
          # cancelled between the two writes leaves that pair on the head permanently, and a
          # PR that only this driver can unblock must not be walled off by a status that will
          # never be completed. Past the grace the resync proceeds, which is the pre-decision
          # baseline and strands nobody.
          ANCHOR_GRACE=1800
          finalizing() {
            local payload cycle_at anchors recorded_at age
            # The head SHA comes from the same listing as the branch name, so this should not
            # fire — but a question asked about a non-SHA gets an API error, and an API error
            # here means "wait", which would be a PR deferred on every push forever.
            if [[ ! "$1" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::warning::'$1' is not a commit SHA; not waiting on a cycle it cannot be asked about" >&2
              echo 0
              return
            fi
            if ! payload="$(gh api "repos/${REPO}/commits/$1/statuses" 2>&1)"; then
              echo "::warning::could not read the review statuses on $1: ${payload}" >&2
              echo 1
              return
            fi
            cycle_at="$(printf '%s' "${payload}" \
              | jq -r '[.[] | select(.context == "review/cycle")] | sort_by(.created_at) | last | .created_at // ""')"
            anchors="$(printf '%s' "${payload}" \
              | jq -r '[.[] | select(.context == "review/verdict-anchor")] | length')"
            if [ -z "${cycle_at}" ] || [ "${anchors}" -gt 0 ]; then
              echo 0
              return
            fi
            # A timestamp that will not parse cannot be aged, and an unbounded wait is the one
            # outcome this grace exists to prevent — so it reads as abandoned rather than as
            # fresh. Its own arithmetic would otherwise abort the whole step under `set -e`.
            if ! recorded_at="$(date -d "${cycle_at}" +%s 2>/dev/null)"; then
              echo "::warning::unreadable review/cycle timestamp '${cycle_at}' on $1; not waiting on it" >&2
              echo 0
              return
            fi
            age=$(( $(date +%s) - recorded_at ))
            if [ "${age}" -ge "${ANCHOR_GRACE}" ]; then
              echo "$1 has carried an unfinalized cycle for ${age}s; treating it as abandoned" >&2
              echo 0
              return
            fi
            echo 1
          }

          # The one reason a PR is left for a later push, or the empty string when it is ready
          # to merge. Both branches are questions about the review pipeline, and both are
          # re-asked after every sleep, because either can clear while the loop waits.
          defer_reason() {
            if [ "$(inflight "$1")" -gt 0 ]; then
              echo "a review run is in flight"
            elif [ "$(finalizing "$2")" -gt 0 ]; then
              echo "a recorded cycle on $2 has no published verdict anchor yet"
            fi
          }

          # One deadline for the whole loop, not per PR: waiting is worth a few minutes in
          # total, never a multiple of however many PRs happen to be open.
          WAIT_DEADLINE=$(( $(date +%s) + 600 ))
          SYNCED=0
          DEFERRED=0

          for entry in "${CANDIDATES[@]}"; do
            [ -n "${entry}" ] || continue
            NUM="${entry%% *}"
            REST="${entry#* }"
            REF="${REST%% *}"
            HEAD_SHA="${REST##* }"

            # Asked first, and re-asked after every sleep — never once more than that. Both
            # halves of the question cost an API call, and a PR that is ready pays for one
            # round of them.
            while :; do
              REASON="$(defer_reason "${REF}" "${HEAD_SHA}")"
              [ -n "${REASON}" ] || break
              [ "$(date +%s)" -lt "${WAIT_DEADLINE}" ] || break
              echo "#${NUM} (${REF}): ${REASON}; waiting"
              sleep 30
            done
            if [ -n "${REASON}" ]; then
              # `deferred` joins the state names `sync_pr_with_base.sh` prints, and like all
              # of them it is a PR left exactly as it already was. Not a warning: a PR this
              # workflow declined to touch is the pre-decision baseline, and annotating every
              # push to ${BASE_REF} for one would be noise about nothing having changed.
              echo "#${NUM} (${REF}): deferred — ${REASON}; the next push to ${BASE_REF} retries"
              DEFERRED=$((DEFERRED + 1))
              continue
            fi

            # Never fatal for the rest of the loop. One PR the script refuses to touch is
            # one PR left exactly as it already was; the others still deserve their sync.
            if ! OUT="$("${TRUSTED}/scripts/sync_pr_with_base.sh" "${TRUSTED}" "${WORK}" "${BASE_REF}" "${REF}" 2>&1)"; then
              printf '%s\n' "${OUT}"
              echo "::warning::could not resync #${NUM} (${REF}); it keeps the state it already had"
              continue
            fi
            printf '%s\n' "${OUT}"

            STATE="$(printf '%s\n' "${OUT}" | sed -n 's/^state=//p' | tail -1)"
            echo "#${NUM} (${REF}): ${STATE:-unknown}"
            if [ "${STATE}" = "synced" ]; then
              SYNCED=$((SYNCED + 1))
            fi
          done

          echo "Resynced ${SYNCED} PR(s) that only the decisions merge driver could unblock; deferred ${DEFERRED}."
