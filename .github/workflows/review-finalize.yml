---
name: Review pipeline — finalize

# The only stage that changes what a human sees: applies labels, posts the summary
# comment, and writes the merge gate.
#
# Reached by three different paths (a real verdict, the cycle cap, an inherited
# verdict), and two of them have no verdict artifact to download. `skip_verdict_artifact`
# exists for exactly that: an unconditional download on those paths fails the job before
# it writes any status, leaving the PR with a stale label and no gate — a worse outcome
# than the NO-GO it was trying to report.

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      reviewed_sha:
        required: true
        type: string
      post_fix_sha:
        description: >
          SHA the merge gate and the review/cycle + review/verdict statuses land on.
          Equals reviewed_sha except when the fixer pushed a new commit, in which case
          it is that commit's SHA (see review-pipeline.yml's `finalize` job). Required,
          not defaulted to reviewed_sha here, so a caller cannot forget to wire it and
          silently stamp the pre-fix SHA (see docs/decisions.md D-fixer-merges-not-rebases).
        required: true
        type: string
      cycle:
        required: true
        type: string
      verdict:
        required: true
        type: string
      category:
        required: true
        type: string
      skip_verdict_artifact:
        required: true
        type: boolean
    secrets:
      WORKFLOW_PAT:
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write
  actions: read

jobs:
  finalize:
    name: Publish verdict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # The fixer claims review/pipeline on post_fix_sha itself (review-fixer.yml's
      # Push step) so the synchronize event it fires is suppressed and no second panel
      # reviews the fix. With that event suppressed, this run is the ONLY place that
      # will ever write review/cycle and review/verdict for post_fix_sha — nothing else
      # runs on it. Stamping both here, not just the merge gate below, keeps the SHA's
      # own commit statuses self-describing for anyone (or any future gather run)
      # inspecting it directly, instead of relying on a one-hop walk to its parent.
      #
      # That reasoning is load-bearing, so note where it does not apply: the sync-only
      # path (D-unguarded-sync) suppresses the fixer's claim so its successor CAN earn a panel, and
      # a SHA another run will review must not arrive pre-stamped with this run's cycle
      # and verdict. review-pipeline.yml keeps it out by passing the pre-sync SHA as
      # post_fix_sha there, so nothing below ever sees a sync-only successor.
      - name: Stamp review/cycle on post-fix SHA
        uses: ./.github/actions/review-state
        with:
          op: write-status
          sha: ${{ inputs.post_fix_sha }}
          context: review/cycle
          state: success
          description: ${{ inputs.cycle }}
          github_token: ${{ secrets.WORKFLOW_PAT }}

      - name: Stamp review/verdict on post-fix SHA
        uses: ./.github/actions/review-state
        with:
          op: write-status
          sha: ${{ inputs.post_fix_sha }}
          context: review/verdict
          state: ${{ inputs.verdict == 'GO' && 'success' || 'failure' }}
          description: ${{ inputs.verdict }}
          github_token: ${{ secrets.WORKFLOW_PAT }}

      - name: Download the verdict artifact
        if: '!inputs.skip_verdict_artifact'
        uses: actions/download-artifact@v4
        with:
          name: verdict-${{ inputs.reviewed_sha }}
          path: verdict

      - name: Download reviewer artifacts
        if: '!inputs.skip_verdict_artifact'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: reviewer-*-${{ inputs.reviewed_sha }}
          path: reviewer-artifacts

      - name: Render and post the summary comment
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          CYCLE: ${{ inputs.cycle }}
          VERDICT: ${{ inputs.verdict }}
          CATEGORY: ${{ inputs.category }}
          # So the comment can name the commit a fixed blocker was fixed in. Equal to
          # reviewed_sha on every path where no fix landed, which the renderer treats as
          # "resolved in this cycle" rather than inventing a commit reference.
          POST_FIX_SHA: ${{ inputs.post_fix_sha }}
          VERDICT_DIR: verdict
          REVIEWER_DIR: reviewer-artifacts
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./.github/scripts/review/render-finalize-comment.sh

      - name: Apply labels
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          VERDICT: ${{ inputs.verdict }}
        run: |
          set -euo pipefail

          # Self-healing: the labels may not exist yet on a fresh repository.
          gh label create agent-reviews-passed --repo "$REPO" --color 0E8A16 \
            --description 'All agent reviewers cleared this SHA' 2>/dev/null || true
          gh label create needs-human-review --repo "$REPO" --color B60205 \
            --description 'Agent review returned NO-GO' 2>/dev/null || true

          if [ "$VERDICT" = "GO" ]; then
            add=agent-reviews-passed; remove=needs-human-review
          else
            add=needs-human-review; remove=agent-reviews-passed
          fi

          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$add" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$remove" 2>/dev/null || true

      # ─────────────────────────────────────────────────────────────────────────
      # The merge gate. This one status MUST be written with GITHUB_TOKEN.
      #
      # Branch protection only honours required-status contexts published by the GitHub
      # Actions app (integration_id 15368). A status posted by a personal access token
      # is recorded and displayed identically, but does not satisfy the protection rule
      # — so using WORKFLOW_PAT here leaves the gate permanently un-green with no error
      # anywhere to explain why.
      #
      # Every other write in this pipeline uses WORKFLOW_PAT. This is the exception.
      #
      # It is written on post_fix_sha, not reviewed_sha. Branch protection evaluates
      # required checks against the PR's current head, and when the fixer pushed, that
      # head IS post_fix_sha — the fixer's own claim (review-fixer.yml's Push step)
      # suppresses the synchronize event that would otherwise start a second pipeline
      # to write this gate for that SHA. Writing it here on the pre-fix reviewed_sha
      # would leave the actual head permanently ungated.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Publish "All Required Agent Reviews"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const verdict = process.env.VERDICT;
            const category = process.env.CATEGORY;
            const cycle = process.env.CYCLE;

            const descriptions = {
              go: `GO — all applicable reviewers cleared (cycle ${cycle})`,
              reviewer_blockers: `NO-GO — unaddressed blocking issues (cycle ${cycle})`,
              pipeline_error: `NO-GO — pipeline could not trust its inputs (cycle ${cycle})`,
              cycle_capped: `NO-GO — review cycle cap reached (cycle ${cycle})`,
              inherited: `${verdict} — inherited from the pre-merge verdict`,
            };

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.POST_FIX_SHA,
              state: verdict === 'GO' ? 'success' : 'failure',
              context: 'All Required Agent Reviews',
              description: (descriptions[category] ?? `${verdict} (cycle ${cycle})`).slice(0, 140),
              target_url: process.env.RUN_URL,
            });
        env:
          VERDICT: ${{ inputs.verdict }}
          CATEGORY: ${{ inputs.category }}
          CYCLE: ${{ inputs.cycle }}
          POST_FIX_SHA: ${{ inputs.post_fix_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
