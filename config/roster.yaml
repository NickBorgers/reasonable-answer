# Role-structured roster (docs/architecture.md).
#
# writers       — models that author reports (round-robin, never the previous author)
# critics       — per-lens pools; a model may be critic-only (never a writer), which is
#                 the clean way to satisfy author-exclusion. Each lens wants >=2 eligible
#                 NON-AUTHOR models for a strong `accepted`.
# orchestrator  — the blind referee's model (optional; defaults to writers[0]). Its whole
#                 job is bounded ints in, one boolean out, so it needs no reach.
#
# Aliases are LiteLLM proxy aliases; their resolved provider/model is fetched from
# the proxy at startup and distinctness is enforced at that level (RA-017).
#
# Every entry is open-weight and loadable on the target local box (D-open-weight-roster). The ceiling is
# ~450GB for a single model, with swapping — see docs/DESIGN.md for the footprint table.

proxy:
  # base_url is the fallback: $RA_PROXY_BASE_URL (or whatever base_url_env names)
  # overrides it when set, so a container can inject only its proxy URL and keep this
  # roster authoritative for everything else. Precedence: env > this value > default.
  base_url: https://llm.featherback-mermaid.ts.net/v1
  base_url_env: RA_PROXY_BASE_URL
  api_key_env: LITELLM_API_KEY
  api_key_fallback: fake-key

roster:
  # Three, not two, because author exclusion applies to writers as well: on every
  # revision round the previous author is removed, so a two-writer pool leaves exactly
  # ONE eligible model and a single flaky response ends the run. Three leaves two
  # (D-provider-retry).
  writers:
    - mistral-large-3      # 675B/A41B Apache 2.0, ~340GB @4bit. Authors R1 and every odd round.
    - deepseek-v4-flash    # 284B/A13B MIT, ~145GB @4bit.
    - nemotron-3-ultra     # 550B/A55B open, ~275GB @4bit. Writer-only: it shrinks no
                           # critic pool, and its Western corpus decorrelates a pool
                           # that is otherwise one Mistral and one DeepSeek.

  # Free, local (ollama), and pinned in memory. Its failure mode is a skipped polish
  # pass and nothing else: rule 9 is cap-gated and the LLM can only *enable* it.
  orchestrator: gemma4-small

  # minimax-m3 is retired from both pools it held (D-minimax-retirement). Three audits
  # across 2026-08-02..07 agreed and worsened: on logic 1.12 invented material issues
  # per sound control with obvious-tier sensitivity down to 0.33, on evidence 1.52
  # invented with sensitivity 0.58 — measured under the `json_schema` mode a run
  # actually pins it to (D-audition-probe-parity). A 30-call spot check attributed the
  # noise to the model, not the corpus: it repeatedly flags a clause while its own
  # quoted span contains the adjacent qualifier that resolves the complaint. A critic
  # whose findings are mostly invented cannot return an honest clean, so runs it
  # reviews stagnate rather than converge. It was critic-only, so it leaves the roster.
  critics:
    # Ordered fit-first (D-completeness-pool-noise precedent): mistral-large-3 is the
    # lens's only measured `fit` (0.94 sensitivity, 0.08 invented per control) and the
    # pass acts on position 1's silence. glm-5.2 (marginal: 1.00 sensitivity, 0.75
    # invented) backs it. mistral also writes, so on rounds it authors the pool thins
    # to glm-5.2 alone — the price of fit-first here; two families (Mistral + Zhipu)
    # keep a strong `accepted` reachable on every other round.
    logic:
      - mistral-large-3
      - glm-5.2            # critic-only: highest GPQA of any shipped open model
    # Both survivors are marginal (glm-5.2: 0.92 sensitivity / 0.42 invented; gemma4:
    # 0.50 sensitivity / 0.12 invented) — the higher-sensitivity model leads because a
    # position-1 miss is the one the run acts on. This is the thinnest lens; the open
    # item is auditioning a replacement candidate, not reshuffling these two.
    evidence:
      - glm-5.2            # critic-only: lowest hallucination of the open frontier
      - gemma4
    # Ordered fit-first (D-completeness-pool-noise). The 2026-08-02 audition measured this
    # lens end to end: gemma4 `fit` (0.89 sensitivity, 0.17 invented material issues per
    # sound control), glm-5.2 `marginal` (0.72), mistral-large-3 `unfit` (2.61 — the
    # highest noise rate measured on any pair, and a 30-call spot check found none of the
    # 13 material issues it filed on 5 of 6 controls were real defects). mistral-large-3
    # is therefore not in this pool; it stays a writer and a logic critic, where its
    # verdict is `marginal` and the roster call waits on the re-audition that follows the
    # control-fixture repairs.
    #
    # Two families survive the drop (Google + Zhipu), so `validate_roster_health` still
    # sees a lens that can reach a strong `accepted`; what is lost is mistral's Western
    # corpus, which is the decorrelation cost of removing a critic that could not return
    # an honest clean. The `fit` model leads because the pass reaches position 1 first,
    # and it is that critic's silence the run acts on.
    completeness:
      - gemma4
      - glm-5.2

# Web search for writers. The code default is off; THIS deployment opts in so
# completeness demands like "cite the specific budget vote" are satisfiable instead
# of stagnating the run (run-75eb136b9bfb).
#
# Startup is fail-closed twice over: no credential is fatal, and so is a writer that
# cannot emit tool calls — that writer would still be told to produce a '## Sources'
# section and would fill it from memory, and nothing downstream can tell a remembered
# citation from a retrieved one. A contributor without a key sets `enabled: false`
# locally or points $RA_CONFIG at another roster.
#
# Credential: $BRAVE_SEARCH_API_KEY (prod) or ./brave.token (local, gitignored).
# Key from https://api-dashboard.search.brave.com/app/keys — the "Data for AI" SKU.
search:
  enabled: true
  api_key_env: BRAVE_SEARCH_API_KEY
  token_file: brave.token
  max_results: 5
  # Unbounded (D-unbounded-evidence). A query cap is a spend control and nothing else,
  # and this deployment would rather buy a search than reason from a citation it could
  # not check. Set an integer here to respect a provider quota — the free Brave tier is
  # 2,000 queries/month, which a 60-query cap stretched to roughly 33 runs.
  # query_budget: 60
  # Bounds the agentic loop's TERMINATION, not its spend: a writer handed a tool that
  # has stopped working will keep calling it until the rounds are gone. Stays.
  max_tool_rounds: 6
  # The free tier is 1 request/second; requests are throttled to stay under it.
  min_interval_seconds: 1.1

  # Attempt EVERY addressable, deduplicated cited URL and hand successful bodies to the
  # evidence critic, so `misrepresented_source` and `fabricated_citation` stop being
  # judgements about plausibility and become checkable against the page. Only
  # unaddressable entries remain unchecked. Independent of `enabled` — a report with real
  # citations can be verified whether or not we retrieved them.
  #
  # "Every" is load-bearing (D-unbounded-evidence). The old `max_sources: 12` truncated
  # the URL list, and a citation the fetcher never saw carried no outcome, never appeared
  # in the critic's sources block, and was judged on its face. run-6611dbb6b02f grew from
  # 8 citations to 23 while only 12 were ever checked, and the resulting supply of
  # unverifiable citations outran every fix: 8 rounds, terminal needs_human_review.
  #
  # This fetches URLs a model chose. That is SSRF exposure by construction and is
  # constrained at the network layer, not here — and that boundary is a deployment
  # concern, deliberately not implemented in this repo (docs/ssrf-egress-isolation.md
  # describes one worked pattern). So the shipped roster leaves verification OFF:
  # flip it on only in a deployment that has such an egress boundary in place.
  # When it is on, an "on its face" fabricated_citation judgement stops being a
  # model-prior guess (and a blocking one) and becomes a checkable fact.
  verify_sources: false
  # Anti-pathological only — it must never bind on a real bibliography (23 is the largest
  # seen). The Sources list is untrusted model output and every entry is an egress, so
  # this bounds a bug, not a bill.
  max_source_urls: 200
  # Page text shown to ONE evidence critic for one artifact. An efficacy bound, not a
  # spend one: every body in a single context is the lost-in-the-middle problem
  # (docs/isolation.md principle #6), and these critics are not large models. Sources past
  # it are still listed, as "FETCHED, TEXT WITHHELD" — listed is the point; omitted is
  # what caused the loop. INTERIM: it disappears once the evidence critic reads each
  # source in its own sub-context.
  source_char_budget: 60000
  # Per-fetch SAFETY bounds, not cost: an unbounded read of a model-chosen URL is a
  # liability whatever it costs. These stay.
  fetch_timeout_seconds: 15.0
  fetch_max_bytes: 400000
  fetch_max_chars: 6000

  # Let a writer READ a page before it cites it (D-writer-source-reads). A search
  # result is a title, a URL and one line of snippet, so without this the writer picks
  # what to claim having never seen the page — which is where bibliography-level
  # citations and over-narrow claim/source pairings come from.
  #
  # Bounded to URLs a web_search returned IN THE SAME WRITER CALL: there is no
  # arbitrary-URL reader, and a refused URL never reaches the network. It egresses
  # through the same fetch boundary verify_sources uses, so the same caveat applies —
  # these are model-chosen URLs, and the egress boundary is a deployment concern
  # (docs/ssrf-egress-isolation.md). Hence OFF in the shipped roster, like verification.
  #
  # read_sources: false
  # read_budget: null          # whole-run reads; null (the default) is unbounded —
  #                            # read_char_budget below is the bound that matters, and it
  #                            # is a correctness one (D-unbounded-evidence)
  # read_max_chars: 6000       # page text shown per read; raising it above
  #                            # fetch_max_chars widens the writer's view only, never
  #                            # the evidence lens's or mechanical adjudication's
  # read_char_budget: 200000   # whole-run page text handed to writers
  #
  # And the audit half: after each draft, ask its writer where each cited claim's
  # support actually sits — citation id, URL, locator, verbatim span, claim — and check
  # every span mechanically against the body that was read. Purely a record: no verdict
  # here becomes a defect, reaches a critic, or touches the stop decision. Requires
  # read_sources (with nothing read there is nothing to check a span against), and costs
  # one extra structured call per draft.
  #
  # support_manifest: false
  # support_max_chars: 60000   # already-read page text re-shown in that pass

# Tiers tried when a plain fetch does not yield the cited document. All off; none of
# this does anything unless search.verify_sources above is on, because nothing fetches.
#
# sources:
#   enabled: false
#   # Read a cited PDF instead of reporting it as an unreadable content type. Until
#   # this existed every cited PDF failed — which is most of the good academic
#   # citations. It reaches no new host: it re-fetches the URL the report already
#   # cited, under its own byte cap, because the 400 KB above exists to stop one
#   # enormous *page* exhausting a run and a real paper routinely clears 10 MB.
#   #
#   # Needs the optional `ingest` extra for pypdf. Enabling it without pypdf installed
#   # is fatal at startup, not at the first citation twenty minutes into a run.
#   pdf:
#     enabled: false
#     max_bytes: 25000000
#     max_pages: 40
#
#   # Env var naming the address Crossref and Unpaywall want for their "polite pool".
#   # Unset is a WARNING, never fatal: requests then go to the anonymous pool, which is
#   # slower and throttled harder — degraded service, not a broken config. Contrast a
#   # missing search credential, which is fatal, because without it the feature cannot
#   # function at all. Unpaywall is the one provider that refuses anonymous requests
#   # outright; it is skipped with its own warning rather than failing the tier.
#   # The value lives in the environment, never in this file (compose.yaml passes it in).
#   contact_email_env: RA_CONTACT_EMAIL
#
#   # D-existence-vs-body. Ask a bibliographic registry whether the cited source EXISTS, when the cited
#   # URL would not hand over its body. This is the cheapest and largest win available:
#   # most good academic and newspaper citations fail the direct fetch precisely because
#   # they are paywalled, and until a registry confirms the DOI a real paywalled paper
#   # looks exactly like a citation nobody ever published.
#   #
#   # What it must NOT do is sharpen `misrepresented_source`. An abstract is a summary
#   # the authors wrote; a claim's absence from one is not evidence the paper does not
#   # make the claim, and the prompt says so wherever it renders metadata.
#   #
#   # It is also the only tier that can RAISE a defect. An identifier every authoritative
#   # registry denies is NOT_FOUND, which D-notfound-fabrication mints as a blocking `fabricated_citation` —
#   # so the escalation is gated twice over (see resolve/__init__.py) and the tier is off
#   # by default like every other retrieval affordance.
#   identifiers:
#     enabled: false
#     # Every listed provider that covers the identifier is asked: the second answer is
#     # what makes a denial worth acting on.
#     providers: [crossref, openalex]
#     timeout_seconds: 10.0
#     # Whole-run call cap. Twelve sources re-verified every round would otherwise scale
#     # with the round count.
#     max_calls_per_run: 60
#
#   # D-existence-vs-body. Find a free copy of the body and read it exactly once. A separate switch from
#   # the tier above because it is a materially different act: that one asks a registry a
#   # question, this one fetches a DIFFERENT document and shows its text to a critic.
#   # Such a body is marked `body_source_url` all the way through, the critic is told it
#   # is reading a mirror (commonly a preprint), and it can never settle a dispute about
#   # the cited URL — a quote present in arXiv v1 and absent from the version of record
#   # would otherwise uphold a dispute about a page nobody read.
#   open_access:
#     enabled: false
#     # Tried in order, stopping at the first that names a copy. `unpaywall` needs the
#     # contact email above; without one it is skipped.
#     providers: [openalex, unpaywall, europe_pmc, arxiv]
#     timeout_seconds: 10.0
#     max_calls_per_run: 40
#   # Tier 2 (D-paid-tier-page): a rendering service reads the cited URL when this process cannot.
#   #
#   # What it buys: JavaScript-rendered pages, and the bot walls that refuse an unknown
#   # HTTP client. What it does NOT buy, and no setting here changes: a hard paywall. A
#   # subscription wall serves a teaser to a real browser too.
#   #
#   # There is no stealth option, deliberately. Every vendor in this market also sells
#   # residential-IP rotation and fingerprint randomisation to defeat bot detection —
#   # the industrial form of the browser impersonation fetch.py has refused since D-source-verification.
#   # The request is pinned to `proxy: basic` in code and a test asserts no stealth mode
#   # appears in the body, so this is not a default someone can flip.
#   #
#   # Needs FIRECRAWL_API_KEY. Enabled with no key, or with no provider named, is fatal
#   # at startup rather than a tier that spends its budget on 401s and calls them
#   # coverage. `max_calls_per_run` unset means the structural ceiling
#   # (search.max_source_urls * budgets.hard_cap): a guard against a fetch loop, not a
#   # spending limit — the per-run cache already resolves each URL once however many
#   # rounds and critics re-verify it.
#   extraction:
#     enabled: false
#     provider: firecrawl
#     timeout_seconds: 45.0
#
#   # Tier 3 (D-paid-tier-page): licensed document delivery — CCC RightFind, Reprints Desk. A seam
#   # with nothing behind it. Those services do lawfully deliver paywalled bodies, per
#   # article, under copyright-cleared single-use terms; reasoning about what those
#   # terms permit when the document is spliced into a model's context is a licensing
#   # question, not an engineering one. `provider: ""` with the tier on is fatal, which
#   # keeps this inert rather than half-built.
#   delivery:
#     enabled: false

# Writer dispute channel (D-writer-disputes, docs/decisions.md). Lets a writer challenge a fix-task
# it believes is factually wrong instead of falsifying the report to satisfy it —
# the failure mode of run-75eb136b9bfb, where critics with stale knowledge demanded
# "corrections" of true recent dates. Adjudication is mechanical-first (the cited
# page settles a citation dispute, when verify_sources is on) with an identity-blind
# arbiter fallback; every inconclusive path leaves the finding standing.
#
# Off by default: with `enabled: false` every prompt and state transition is
# byte-identical to a build without the feature.
disputes:
  enabled: false
  # Whole-run adjudication budget; disputes past it are dismissed unadjudicated.
  budget: 6
  # Disputes accepted from one revision pass.
  max_per_pass: 3

# Critic auditioning (docs/architecture.md). Measures whether each rostered critic can
# actually find a planted defect and stay quiet on a sound report — the question neither
# `validate_roster_health` nor `ra doctor`'s probes ask.
#
# This exists because run-d5934276fafd shipped with two lenses effectively unstaffed:
# llama-4-scout returned 0 issues on all 6 evidence calls and gemma-4-31b-it 0 on all 6
# completeness calls, across artifacts other critics found 6 and 10 material issues in.
# Every counter and status in that run read as though three lenses had reviewed it.
#
# Off by default: an audition costs |critics| x |fixtures| x repetitions calls against a
# paid proxy, and a checkout with no credential must behave exactly as it always has.
# Run it deliberately with `ra audition`; `ra doctor` only reads the cache it leaves.
#
# NOTE on this roster specifically: `gemma4` is the same model as the gemma-4-31b-it
# that flagged nothing in that run. On completeness that worry is now answered by
# measurement rather than by position — the 2026-08-02 audition graded it `fit` there —
# which is why D-completeness-pool-noise moved it to position 1 of a two-model pool.
# On evidence it is now at position 2 of a two-model pool, and it is measured, not
# unmeasured: see the `evidence:` pool comment above, which grades it `marginal`
# (0.50 sensitivity / 0.12 invented material issues per sound control).
# At `review.depth: 2` a two-model pool means both positions read every draft. Neither
# evidence critic is in `writers:`, so author exclusion never shrinks this pool: both
# families stay eligible every round, gemma4 is reached on the ordinary first pass, and
# a strong `accepted` remains reachable. The residual is critic quality, not
# `roster_limited`: both critics are marginal, so a first-pass miss by glm-5.2 followed
# by a clean from gemma4 can terminate the run as `accepted` on two marginal opinions.
# Re-audition the pair before raising `review.depth` above 2.
# Measuring is opt-in by being its own command (`ra audition`) — there is no `enabled`
# flag here. Everything below only shapes what that command measures and what the two
# cache readers, `ra doctor` and the `enforce` gate, make of the result.
audition:
  # Warn rather than abort when a critic grades `unfit`. Fail-closed is the right
  # instinct — the soundness claim is void without capable reviewers — but coupling
  # every run to a cache whose freshness depends on a rate-limited proxy means an
  # operator blocked by an expired audition disables the harness outright. Turning this
  # on makes `ra run` and the web server refuse to start while an assigned critic is
  # measured `unfit`; `marginal`, `stale` and `not audited` stay warnings regardless.
  enforce: false
  cache_path: .ra-audition.json
  max_age_days: 30
  # Critics are non-deterministic — the same model returns different issue lists on
  # repeated calls. Single-shot auditioning would inherit that flakiness and report it
  # as capability.
  repetitions: 3
  max_concurrency: 3
  thresholds:
    # Fail-closed line, measured on `tier: obvious` fixtures only. A model scoring
    # exactly 0 there is unfit regardless of this value — that case is not tunable.
    min_obvious_sensitivity: 0.5
    warn_lens_sensitivity: 0.6
    # Mean material issues invented per sound control report. Above this a critic
    # manufactures work every round and the run stagnates instead of converging.
    max_control_material_rate: 1.0
    warn_control_material_rate: 0.34
    max_schema_failure_rate: 0.2

# How many independent critics read each draft, per lens (D-front-loaded-depth). These are the
# code defaults, spelled out here for the same reason `revision` below is: this is the knob you
# reach for when comparing convergence.
#
# `depth: 2` means every generated artifact is read by TWO eligible non-author model families on every
# lens, and the union is triaged before any revision. It used to be one, with the second critic
# deferred to controller rule 8 — which only fires after a pass has already reported the draft
# clean. Front-loading makes the configured witnesses' findings available to that same triage pass.
#
# `depth: 1` restores the old single-critic discovery pass. A failed rule-8 confirmation now stays
# beside the completed review instead of replacing it, so that top-up path no longer aborts only
# because a confirmation provider failed.
#
# It is a CEILING, not a quota: a pass runs min(depth, fresh eligible non-author model families),
# so a lens the roster can staff from only one family still runs one critic and still ends
# `converged_unconfirmed` rather than aborting. Cost scales with depth in calls and wall-clock, not in proxy load —
# `budgets.max_concurrency` still bounds how many run at any instant.
#
# Before raising this, re-run `ra audition`: every pool position below `depth` now reads every
# draft, so a critic that used to be a rule-8 formality is now part of ordinary discovery.
# `ra doctor` warns about exactly those slots.
review:
  depth: 2
  # Per-lens overrides, e.g. `per_lens: {evidence: 3}`. Absent lenses use `depth`.
  per_lens: {}

# How a writer is asked to apply a defect list (D-scoped-revision). Both settings below are
# the code defaults and are spelled out here because they are the knob you reach for
# when comparing convergence, not because they need setting.
#
# `patch` tells the writer to change only the paragraphs a fix task named and return
# the rest byte-identical. It exists because six consecutive production runs finished
# with zero `accepted`: the writer was applying essentially every fix task, and the
# material count still would not fall (mean 5.39 before a regeneration, 4.81 after),
# because re-rolling ~1,800 words to repair ~5 paragraphs grows about as many fresh
# defects as it retires. `rewrite` restores the old prompt byte for byte, so the two
# arms are comparable from configuration rather than from a checkout.
#
# What it does NOT change, and this is the point: critics still read the whole document
# every tick, writers still rotate so no model ever patches its own last draft, and a
# new draft is still a new hash and therefore a fresh clean-record set (RC-002). The
# decorrelation layer is the critic roster (docs/isolation.md), not the rewrite.
#
# `scope_check: warn` records what the revision actually touched on the `generate`
# event (`changed_paragraphs`, `in_scope`, `out_of_scope`, `defect_loci_untouched`) and
# never rejects a draft — a rejection would burn one of three `writer_attempts`.
revision:
  mode: patch
  scope_check: warn

budgets:
  min_ticks: 2
  hard_cap: 8
  polish_cap: 1
  # Whole-document rewrites a stalled run may spend before rule 13 gives up
  # (D-scoped-revision). Patching can only accrete, and an accreted document is what the
  # completeness lens punishes; one rewrite by a fresh writer is the escape valve. It
  # also gives rule 13 a job at all — the stagnation signature has to be byte-identical
  # for `stagnation_limit` ticks, and real trajectories jitter, so it never fired.
  # Set to 0 to make stagnation terminal on sight, as it was before.
  rewrite_cap: 1
  critique_attempts: 12
  confirmation_attempts: 6
  stagnation_limit: 3
  cycle_period: 4
  repair_retries: 1
  # Repairs offered to a critic whose issue failed validation — a `claim_span` that is
  # not really in the paragraph it cites, a locus that does not exist. The repair shows
  # it the text it should have quoted. Wider than `repair_retries` because the fallback
  # is controller rule 2, which discards every issue in the response and spends one of
  # the 12 `critique_attempts` re-asking a fresh model the identical question.
  critic_repair_retries: 2
  call_retries: 2
  # Attempts at one draft before the run gives up. They rotate through the eligible
  # writer pool and wrap, so a model that is down or answering with nothing is routed
  # around when there is somewhere to route to, and given another spaced chance when
  # there is not. Wrapping never re-asks the previous author — exclusion removed them
  # before the rotation started (D-provider-retry).
  writer_attempts: 3
  timeout_seconds: 300
  # Wait before each retry: min(base * 2^(n-1), max) seconds, times jitter in
  # [0.5, 1.0]. Retrying instantly is what turned three transient empty completions
  # into three aborted runs — the whole budget was spent inside five seconds (D-provider-retry).
  retry_backoff_seconds: 2.0
  retry_backoff_max_seconds: 30.0
  max_concurrency: 3

# Identity comes from a header set by whatever fronts the app — Cloudflare Access or
# `tailscale serve` — and a request carrying neither is refused (D-identity-header,
# docs/authentication.md). `dev_identity` gives such a request an identity instead:
# what local development needs, and a public login anywhere else. $RA_DEV_IDENTITY
# overrides it and is how `make serve` sets it, so this stays unset in the file a
# deployment mounts.
# auth:
#   dev_identity: you@example.com

# Pre-run question refinement (D-question-refinement, docs/question-refinement.md). While the asker
# pauses after typing, a small model is asked whether the question as worded encodes a
# framing that will fight the pipeline — a false either/or, an unverified premise, an
# unscoped "net positive?" verdict — and up to three reframe chips appear under the
# textarea when it finds one. Nothing is ever blocked, corrected on screen, or applied
# without a tap.
#
# The code default is off; THIS deployment opts in, because the run history is what
# motivated the feature: run-75eb136b9bfb (false either/or, 7 rounds, needs human
# review), run-40de6a7cdbf9 (unverified premise plus a buried practical goal, 8 rounds,
# exhausted), run-3e184fb11a36 and run-5af587189b89 (unscoped "net X" scalar verdicts).
# A ~3-second suggestion is cheap next to a 10-25 minute run that was unanswerable as
# asked.
#
# One availability consequence of turning this on, stated plainly: when enabled, the
# refine alias joins startup identity resolution and structured-output probing, so the
# web server now needs the proxy reachable to boot at all. With it off, the UI came up
# regardless and only a run needed the proxy. That is the fail-closed trade the design
# chose (a schema-incapable alias must not surface on a user's first pause) — set
# `enabled: false` if browsing past runs during a proxy outage matters more.
#
# That boot dependency is also why this file is no longer the one baked into the image:
# config/roster.default.yaml is, and it leaves refinement off so the image still starts
# with nothing mounted and no network. compose.yaml mounts THIS file over it.
#
# `alias` is left empty, so refinement uses the orchestrator alias (gemma4-small):
# local, free, already resolved and probed at startup, and orchestrator-class judgment
# is exactly the shape of this task. Naming a different alias here would only buy real
# isolation from run traffic if that alias is routed to a dedicated backend/resource
# pool — the name alone proves nothing (see D-question-refinement's isolation accounting).
refine:
  enabled: true
  alias: ""
  max_suggestions: 3
  # Provider-level request timeout for the refine call only. The asker is waiting on
  # this one, unlike a run's 300s writer call.
  timeout_seconds: 5.0
  cache_entries: 256
  cache_ttl_seconds: 900
  # Separate from submit_rate_max: a person pausing while typing triggers many more
  # refine calls than submissions.
  rate_max: 10
  rate_window_seconds: 60
  # A hard ceiling on live refine calls, shed (never queued) past it.
  concurrency: 2
  offer_entries: 512
  offer_ttl_seconds: 1800
  orphan_linger_seconds: 30
  # `question_behind_the_question` is deliberately absent: it is the only transform
  # that lets the model infer an unstated concern, and it stays off until the
  # paired-fixture audition in docs/question-refinement.md passes.
  enabled_transforms:
    - split_the_either_or
    - check_the_premise_first
    - name_the_outcome
    - surface_the_real_goal
    - ask_whats_answerable

runs_dir: runs
retention_days: 14
