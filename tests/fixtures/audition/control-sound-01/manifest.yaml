# A control declares no `lens` and no `tier` (D-control-soundness): it is graded by
# every lens, and it gates no sensitivity threshold because it plants nothing.
#
# One of the two unpaired controls (D-fixture-report-shape): it has no planted sibling,
# so it also checks that the corpus is not merely a set of near-duplicate pairs.
#
# Soundness contract, which no test can check and review therefore must: every empirical
# claim carries an inline [n] citation resolving to a numbered `## Sources` entry; the
# question's ambiguous term is named and decomposed rather than assumed; the strongest
# opposing case — that the negative reading mistakes a gap in the literature for a
# finding — has its own section, is granted where it is right, and is answered by naming
# the study design that would settle it; five sources across social history (Fee, Tomes),
# epidemiology (Markel et al.) and economics (Cutler & Miller, Almond) put
# `one_sided_sourcing` out of honest reach on discipline alone (D-fixture-report-shape
# correction: an earlier revision of this comment claimed "six sources ... in two
# countries"; the shipped artifact has always had five, all US-focused, and the comment
# is corrected to describe what ships rather than restoring a claim nothing in the body
# supports). The `## Conclusion` section summarises material cited below it, per the
# conclusion-first report template — a critic that raises `uncited_claim` against it is
# over-flagging, which is what this fixture measures.
#
# D-control-defect-sweep correction: S5.P2's "this is the component on which the answer
# above is most confidently negative" sat unreconciled against S3.P2 ("the conclusion is
# hedged rather than negative") and S1.P1 ("absence of studies, not absence of effect").
# The tension is resolvable — the sanitation confidence rests on Cutler & Miller's
# multi-decade trend data [4], not on the severity-identification design S3 says nobody
# has run — but the artifact never said so, and three critics in a row filed it. S5.P2
# now states the distinction and still declines to exclude an acceleration, so the
# report's hedged posture is unchanged. Consistency between sections is part of this
# contract, not only per-claim citation.
kind: control
question: "Did the 1918 influenza pandemic accelerate the adoption of public health infrastructure?"
