lens: logic
tier: moderate
question: "How has maintenance of widely used open-source software changed since corporate sponsorship programs became common?"
defects:
  - category: overstated_claim
    locus: {section: 4, paragraph: 1}
    note: >
      The empirical-anchor half of D-conceptual-conflation, planted as `overstated_claim`
      because that decision resolves it there rather than in a new evidence category: the
      support is real, cited and accurately described, and it is the *claim* that outruns
      it.

      S4.P1 makes three claims that turn on scale, prevalence and timing —
      maintenance-first working "became the ordinary condition of widely used open source
      within about three years", unsponsored feature-first maintenance "is now rare at that
      tier of usage", and the turnover "ran faster than any earlier shift in how this work
      was paid for" — and cites [3] and [4] for all three. The corresponding paragraph in
      the control says what those two are: a maintainer survey of 437 self-selected
      respondents recruited through a social media campaign, and a single-project case
      study. Neither reports a denominator over projects, neither samples unsponsored
      projects at any tier of usage, and neither dates a transition. A cross-sectional
      comparison of paid and unpaid respondents is being offered where a proportion, a base
      rate and an interval are claimed.

      It is load-bearing: the closing sentence uses the prevalence claim to convert the
      whole report from a description of sponsored projects into a description of the
      ecosystem.

      The fix is available inside the report, which is why this is not an evidence-lens
      demand for a dataset: qualifying the paragraph to what the sources establish is a
      complete resolution, and `control-base-open-source-01` is that paragraph written that
      way.

      Tier is moderate rather than obvious. The rest of the report is careful with the same
      evidence — S3 states the survey's own causality caveat and S5.P2 reports a null result
      as its authors report it — so the overstatement sits in one paragraph of an otherwise
      measured document, which is where this defect actually occurs.

      Grading note: a critic may reasonably file this locus as `invalid_inference` (an
      ecosystem-wide reading does not follow from a self-selected maintainer sample), as
      `conceptual_conflation` (surveyed maintainers substituted for the population of widely
      used projects), or as `contradicted_claim` (the report's other sections say the record
      cannot settle prevalence). Those are the same defect seen from a different side, all
      four categories sit on the logic lens, the fixture grades the same-lens window, and
      any material logic finding at S4 scores.

      Directory is `-03` because `overstated-claim-01` and `-02` already name different
      fixtures — a hedge dropped from a small average effect, and a counterfactual certainty
      about a municipal budget. A third is not redundant: this one is the only fixture in
      the corpus where the overstatement is specifically a magnitude/prevalence/timing claim
      resting on support that cannot carry it, which is the reading D-conceptual-conflation
      adds to the category and which nothing measured before.
