# Production shape per D-fixture-report-shape. Derived from a sound base whose S5.P2 read
# "the association is consistent with a causal effect, but the studies cited cannot
# separate the lane from the municipal programme it arrives with"; the base is not
# shipped, to keep the audition's per-model call count bounded.
lens: logic
tier: moderate
question: "Do bike lanes reduce traffic fatalities?"
defects:
  - category: invalid_inference
    locus: {section: 5, paragraph: 2}
    note: >
      S5.P2 moves from an observed association to a universal causal prediction about
      "any city that builds them". The report elsewhere is careful — S1.P1 says the
      mechanism is contested, S3 gives reverse causation and selection their own section,
      S6.P1 concedes no staggered-adoption study has reported — so the fixture tests
      whether a critic catches an overreach that the surrounding text explicitly
      disclaims. Tier is moderate rather than obvious because the underlying causal story
      in S5.P1 is plausible and a fast reader may wave it through.
