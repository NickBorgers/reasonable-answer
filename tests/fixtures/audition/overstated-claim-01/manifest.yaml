lens: logic
tier: moderate
question: "Does vitamin D supplementation prevent respiratory infections?"
defects:
  - category: overstated_claim
    locus: {section: 5, paragraph: 2}
    note: >
      S5.P2 drops every hedge the report established for itself. Ground truth, from the
      report's own support: an adjusted odds ratio of 0.88 (95% CI 0.81 to 0.96) for
      having at least one infection and a number needed to treat of 33 (95% CI 20 to
      101) overall; a markedly stronger effect in the daily-or-weekly dosing subgroup
      (aOR 0.81) than in trials using a bolus dose (0.97); a markedly stronger effect
      below 25 nmol/L baseline (aOR 0.30) than at or above it (0.75); and two large
      trials — CORONAVIT and a Norwegian cod liver oil trial — that found no reduction
      at all. What that licenses is "a small average reduction, concentrated in
      deficient people supplemented daily or weekly". (Verified fetched: PMC5310969
      for the 2017 IPD meta-analysis's aOR, NNT and both subgroup splits; PMC9449358
      and PMC9449357 for the two null trials. The fixture originally also cited a 2021
      aggregate-data update reporting OR 0.92 — Jolliffe et al., *Lancet Diabetes &
      Endocrinology* — but neither the publisher DOI nor its medRxiv preprint mirror
      returns fetchable full text through the review pipeline's fetch boundary
      (403/landing page on both), so that claim was removed rather than left resting
      on an unverifiable citation. The planted defect does not depend on it: the 2017
      IPD analysis alone already establishes the hedged, subgroup-concentrated finding
      S5.P2 flattens.)
      What S5.P2 asserts is "Daily vitamin D supplementation prevents acute
      respiratory infections" flatly, and that an individual "can expect to get through
      the winter without an infection they would otherwise have had" — restating a
      roughly 3 percent absolute chance as an expectation.
      Fixture-authoring note for whoever edits this next: do not write the cholecalciferol
      form as "vitamin D" followed by a bare 3. `tests/test_citation_resolution.py`
      scans the tree for stale numeric decision ids (`\bD[0-9]{1,2}\b`) and that spelling
      trips it, which is why the null trials cited here are CORONAVIT and the Norwegian
      cod liver oil trial rather than VIDARIS.
      Distinct from invalid_inference-01, which moves from an observed association to a
      causal prediction: causation is not the leap here, because the support is
      randomized trials and the direction of the effect is exactly what the report says
      it is. Only the magnitude and the generality are inflated. Distinct from
      loaded_language-01, which smuggles an evaluative verdict in through wording: the
      wording here is plain, and the sentence would be unobjectionable if the pooled
      effect were large.
      Tier is moderate, not obvious. The overstatement sits sections away from the numbers
      that constrain it, "prevents" is ordinary shorthand for "reduces the risk of", and
      S5.P1 immediately before it is careful about baseline status — so a fast reader can
      carry that care forward onto S5.P2 and wave it through without being incompetent. It
      also negates nothing stated elsewhere: the report never says supplementation fails
      to prevent infections, so a critic scanning for contradictions rather than weighing a
      claim against its support finds nothing here. That is the point — the fixture
      measures whether the critic holds the claim against the support, not against a
      neighbouring sentence.
      No slot rotation: nothing here is a fabricated surface form. The three sources are
      real and accurately listed, and the defect lives in the strength of the prose, not
      in a name a model could memorize.
