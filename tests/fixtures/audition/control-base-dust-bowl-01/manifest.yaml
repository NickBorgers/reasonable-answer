# A control declares no `lens` and no `tier` (D-control-soundness): it is graded by
# every lens, and it gates no sensitivity threshold because it plants nothing.
#
# This is the sound base of `contradicted-claim-01` (D-fixture-report-shape). Shipping
# the base alongside its mutant is what breaks the form confound: the two documents
# match on length, section structure, citation density and topic, so "long and balanced"
# stops being a usable proxy for "sound".
#
# Soundness contract, which no test can check and review therefore must: every empirical
# claim carries an inline [n] citation resolving to a numbered `## Sources` entry, or is
# marked in the text as an inference; the conclusion names the unit it is about and
# declines to extend to the unit it is not; the strongest opposing case (that county
# averages hide individual-level persistence) has its own section and is engaged on the
# merits rather than dismissed; the sourcing spans a social history, three empirical
# economics papers and a study of a different country, so `one_sided_sourcing` — which
# floors to `major` — cannot be earned honestly. Magnitudes the author cannot stand
# behind are stated as unidentified rather than quoted precisely.
kind: control
question: "Did the Dust Bowl migration permanently depress wages in California?"
