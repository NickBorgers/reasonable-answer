<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'">
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">
<title>Offline — reasonable-answer</title>
<!-- Deliberately self-contained and link-free. This page is only ever shown when the
     server is unreachable, so a link to a run would be a link to a page that cannot
     load. The styles are inline because the stylesheet lives in the Python that is
     also unreachable at this point. -->
<style>
:root { color-scheme: light dark; --bg: #fbfaf8; --ink: #1a1a1a; --dim: #6b6b6b; }
@media (prefers-color-scheme: dark) { :root { --bg: #16181a; --ink: #e8e6e3; --dim: #9a9691; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  padding: max(1.5rem, env(safe-area-inset-left)) 1.5rem;
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 26rem; }
h1 { font-size: 1.05rem; font-weight: 650; letter-spacing: -.01em; margin: 0 0 .6rem; }
p { color: var(--dim); margin: 0 0 .6rem; }
</style>
</head>
<body>
<main>
  <h1>reasonable&#8209;answer is unreachable</h1>
  <p>You appear to be offline, or the tailnet host is not answering.</p>
  <p>Runs are live data, so none of them are stored on this device — there is nothing to
  show you until the connection is back. Reload once it is.</p>
</main>
</body>
</html>
