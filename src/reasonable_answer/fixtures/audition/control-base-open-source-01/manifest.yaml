# A control declares no `lens` and no `tier` (D-control-soundness): it is graded by
# every lens, and it gates no sensitivity threshold because it plants nothing.
#
# This is the sound base of `overstated-claim-03` (D-conceptual-conflation), and it is the
# corpus's **qualitative-evidence control**. The two artifacts differ in exactly one
# paragraph, S4.P1: there it claims a proportion, a base rate and an interval off two small
# collections of maintainer accounts; here it says the record does not settle prevalence or
# pace, names why (both collections were drawn from maintainers who already held
# sponsorship, neither reports a denominator), and restricts the report to a claim about
# kind. Everything else is byte-identical.
#
# What this control measures is the narrowing condition on the empirical-anchor reading of
# `overstated_claim`. The report is built almost entirely on qualitative evidence and makes
# almost entirely qualitative claims — what maintainers describe, in what order, and what
# the fiscal host's terms move where. Those claims turn on kind, not on magnitude,
# prevalence, timing or change, so no anchor is owed and none is missing. A critic that
# demands a figure for "the work becomes scheduled rather than opportunistic", or that
# reads the explicit refusal in S4.P1 as the absence of support rather than as the
# qualification the rule asks for, is inventing a material issue and scores as noise. That
# is the direction the decision's control-noise gate is watching: without it, the widened
# category reads as "quantify everything" and every honest qualitative report stagnates.
#
# Soundness contract, which no test can check and review therefore must: every empirical
# claim carries an inline [n] citation resolving to a numbered `## Sources` entry; the
# question is contested and the sourcing spans a maintainer-side collection, an academic
# interview study, a corporate program survey and a methodological critique that argues
# against this report's own reading, so `one_sided_sourcing` — which floors to `major` —
# cannot be earned honestly; the strongest opposing case (that the governance change alone
# explains everything) has its own section, is granted the finding it fits and the fact
# that this record cannot refute it, and is answered only on the one point where the
# accounts bear against it, with that evidence labelled weak; the contested presupposition
# in the question — that maintenance has changed — is not inherited, because S4.P1 states
# what the record can and cannot establish about it; and each of the three numeric claims
# in the report (nineteen of twenty-two, nine of twelve, 78 percent) is attached to the
# source that reports it.
kind: control
question: "How has maintenance of widely used open-source software changed since corporate sponsorship programs became common?"
