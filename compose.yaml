# Assumes the host can already reach the LiteLLM proxy — on this network that means
# the host is on the tailnet. Nothing here configures that.
#
# Callers are identified by a header the app trusts without verifying, so anyone who can
# reach the published port can claim to be any user. Keep it on loopback and let the
# proxy that sets the header be the only way in — docs/authentication.md.
#
#   docker compose up -d

services:
  ra:
    build:
      context: .
      args:
        # Stamps runs with the commit that built the image (docs/run-provenance.md).
        # Export it to make a locally-built image attributable:
        #   RA_BUILD_SHA=$(git rev-parse HEAD) docker compose up -d --build
        # Left unset it stays empty, and the app falls back to reading the checkout or
        # to recording source=unknown — never to inventing a commit.
        RA_BUILD_SHA: "${RA_BUILD_SHA:-}"
    image: reasonable-answer:latest
    restart: unless-stopped
    # A run is 10-25 minutes, so no grace period can "wait for it to finish". This
    # buys enough time for the in-flight node — roughly one model call — to land and
    # checkpoint, after which the restart resumes the run automatically. Correctness
    # does not depend on the number: the checkpointer bounds a hard kill to the node in
    # flight. Shortening it only means re-paying for that node.
    stop_grace_period: 120s
    # Nothing this container runs needs to write outside the audit trail, so nothing is
    # allowed to. The image already puts /app out of reach by owning it as root; this
    # closes the rest of the filesystem, and the two together mean a compromise cannot
    # leave anything behind that survives the next restart.
    #
    # Mounts stay writable under read_only — that is the point. The writable surface is
    # exactly ra-runs below, plus the /tmp scratch space.
    read_only: true
    # Required, not precautionary. Starlette spools a multipart part carrying a filename=
    # to a temp file once it exceeds 1MB, and it does so *before* FastAPI checks the route
    # signature — so an oversized file part on POST /runs reaches /tmp even though this app
    # declares only string form fields and serves no upload. SQLite also spills here.
    # noexec/nosuid keep it from being somewhere to stage a dropped payload; the size cap
    # keeps that spool from filling the host's memory.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # The app binds 8080, which needs no capability at all, and nothing here is setuid.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Audit trail + SQLite checkpoints. Without this, runs and resumability die
      # with the container. A named volume avoids the root-owned bind mount problem.
      - ra-runs:/data/runs
      # Edit the roster without rebuilding the image.
      - ./config/roster.yaml:/etc/ra/roster.yaml:ro
    environment:
      # The container's CMD is fixed, so `--verbose` is not reachable; this is how a
      # deployment asks for INFO. Worth the volume: a night of aborted runs left only
      # WARNING lines behind — no run starts, no controller decisions, no search
      # results — and the post-mortem had to infer what the logs should have said
      # (D-provider-retry). Nothing at INFO carries run material: search logs query *lengths*
      # (RA-016) and the controller is blind to the report by construction.
      RA_LOG_LEVEL: "INFO"
      # Every concurrent run multiplies load on one proxy; the local models in the
      # roster are the bottleneck the design is built around.
      RA_MAX_CONCURRENT_RUNS: "1"
      # Must match stop_grace_period above. Every internal deadline derives from it —
      # the worker's wait for a node boundary nests inside uvicorn's connection drain,
      # which nests inside this. Deriving them keeps that order when the platform is
      # retuned; independent constants would eventually invert unnoticed.
      RA_SHUTDOWN_GRACE_SECONDS: "120"
      # Interrupted runs are re-enqueued at boot. Set to 0 to park them instead, which
      # is what you want while debugging a run that crashes the process on startup.
      # RA_RESUME_ON_BOOT: "0"
      # Only needed if the proxy is behind auth.
      # LITELLM_API_KEY: ${LITELLM_API_KEY}
      # Required while the mounted roster has search.enabled: true — startup fails
      # closed without it. brave.token does not exist inside the container.
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      # Crossref/Unpaywall's polite pool (D-existence-vs-body). Passed explicitly like the key above,
      # because a variable the operator exports outside the container does not reach the
      # process inside it — and the failure would be silent: every registry request would
      # quietly fall back to the anonymous, harder-throttled pool while the roster claims
      # otherwise. Startup warns when it is unset, which is what makes that visible.
      RA_CONTACT_EMAIL: ${RA_CONTACT_EMAIL:-}
      # The keyed source tiers (D-paid-tier-page). Unlike the contact email above, a missing one of
      # these is never silent: the tier that wants it refuses to start rather than
      # spending its whole call budget on 401s and reporting them as coverage. Both are
      # inert until the matching tier is switched on in the roster.
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      CORE_API_KEY: ${CORE_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Cloudflare Access, the way friends reach this. Sharing the app's network namespace
  # means the tunnel talks to it over loopback, so the port above need not be published
  # at all. Create the tunnel and its Access application first — docs/authentication.md.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${TUNNEL_TOKEN}
  #   network_mode: "service:ra"

volumes:
  ra-runs:
